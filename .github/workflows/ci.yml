name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile content from markdown
        run: python3 scripts/compile_content.py

      - name: Verify generated data is up to date
        run: git diff --exit-code -- data/

      - name: Run JS tests
        run: npm test

      - name: Lint markdown
        run: npx --yes markdownlint-cli2 "**/*.md"
